<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Barangay Solo Parent Information System</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            primary: { 600: '#2563eb', 700: '#1d4ed8' },
            secondary: { 500: '#eab308', 600: '#ca8a04' }
          }
        }
      }
    }
  </script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: system-ui, -apple-system, sans-serif; }
    .btn-primary { background: #2563eb; color: white; padding: 10px 24px; border-radius: 8px; font-weight: 500; }
    .btn-primary:hover { background: #1d4ed8; }
    .btn-secondary { background: #eab308; color: white; padding: 10px 24px; border-radius: 8px; font-weight: 500; }
    .btn-secondary:hover { background: #ca8a04; }
    .input-field { width: 100%; padding: 10px 16px; border: 1px solid #d1d5db; border-radius: 8px; }
    .input-field:focus { outline: none; border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59,130,246,0.1); }
  </style>
</head>
<body class="bg-gray-50">
  <div id="app">
    <div class="min-h-screen flex items-center justify-center">
      <div class="text-center">
        <div class="w-16 h-16 bg-blue-600 rounded-full flex items-center justify-center mx-auto mb-4">
          <span class="text-white font-bold text-2xl">SP</span>
        </div>
        <h1 class="text-2xl font-bold text-gray-800 mb-2">Solo Parent Information System</h1>
        <p class="text-gray-600 mb-4">Loading...</p>
        <div class="animate-spin rounded-full h-10 w-10 border-b-2 border-blue-600 mx-auto"></div>
      </div>
    </div>
  </div>

  <script type="module">
    import { render, h } from 'https://esm.sh/preact@10.19.3';
    import { useState, useEffect } from 'https://esm.sh/preact@10.19.3/hooks';
    import htm from 'https://esm.sh/htm@3.1.1';

    const html = htm.bind(h);

    const api = {
      async request(endpoint, options = {}) {
        const token = localStorage.getItem('token');
        const headers = { 'Content-Type': 'application/json', ...options.headers };
        if (token) headers['Authorization'] = 'Bearer ' + token;
        const res = await fetch('/api' + endpoint, { ...options, headers });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Request failed');
        return data;
      },
      auth: {
        login: (data) => api.request('/auth/login', { method: 'POST', body: JSON.stringify(data) }),
        register: (data) => api.request('/auth/register', { method: 'POST', body: JSON.stringify(data) }),
        me: () => api.request('/auth/me')
      },
      applicants: {
        create: (data) => api.request('/applicants', { method: 'POST', body: JSON.stringify(data) }),
        getAll: () => api.request('/applicants')
      },
      admin: {
        updateStatus: (id, data) => api.request('/admin/applicants/' + id + '/status', { method: 'PUT', body: JSON.stringify(data) })
      },
      dashboard: { getStats: () => api.request('/dashboard') }
    };

    const Navbar = ({ user, onLogout }) => html`
      <header class="bg-white shadow-sm sticky top-0 z-50">
        <nav class="max-w-7xl mx-auto px-4 py-4 flex items-center justify-between">
          <a href="/" class="flex items-center gap-3">
            <div class="w-12 h-12 bg-blue-600 rounded-full flex items-center justify-center">
              <span class="text-white font-bold text-lg">SP</span>
            </div>
            <div>
              <h1 class="font-bold text-gray-800">Solo Parent</h1>
              <p class="text-xs text-gray-500">Barangay System</p>
            </div>
          </a>
          <div class="flex items-center gap-4">
            ${user ? html`
              <a href="/apply" class="text-gray-600 hover:text-blue-600 font-medium">Apply</a>
              <a href="/dashboard" class="text-gray-600 hover:text-blue-600 font-medium">Dashboard</a>
              <button onClick="${onLogout}" class="text-red-600 hover:text-red-700">Logout</button>
            ` : html`
              <a href="/login" class="text-gray-600 hover:text-blue-600 font-medium">Login</a>
              <a href="/register" class="btn-primary text-sm px-4 py-2">Apply Now</a>
            `}
          </div>
        </nav>
      </header>
    `;

    const Home = ({ user, onLogout }) => html`
      <div>
        <${Navbar} user="${user}" onLogout="${onLogout}" />
        
        <section class="bg-gradient-to-br from-blue-600 to-blue-800 text-white py-20">
          <div class="max-w-4xl mx-auto px-4 text-center">
            <h1 class="text-4xl font-bold mb-4">Barangay Solo Parent <span class="text-yellow-400">Information System</span></h1>
            <p class="text-lg text-blue-100 mb-8">Apply for Solo Parent ID online, track your application status, and access government benefits.</p>
            <a href="/register" class="btn-secondary inline-flex items-center gap-2 text-lg px-8 py-3">Apply Now →</a>
          </div>
        </section>

        <section class="py-16 bg-white">
          <div class="max-w-4xl mx-auto px-4 text-center">
            <h2 class="text-3xl font-bold text-gray-800 mb-8">Requirements</h2>
            <div class="grid md:grid-cols-3 gap-6">
              ${['Valid ID', 'Barangay Certificate', 'Birth Certificate', '2x2 Photo', 'Supporting Docs', 'Application Form'].map(req => html`
                <div class="bg-gray-50 rounded-lg p-4 flex items-center gap-3">
                  <div class="w-8 h-8 bg-blue-100 rounded-full flex items-center justify-center text-blue-600">✓</div>
                  <span>${req}</span>
                </div>
              `)}
            </div>
          </div>
        </section>

        <section class="py-16 bg-gray-50">
          <div class="max-w-4xl mx-auto px-4 text-center">
            <h2 class="text-3xl font-bold text-gray-800 mb-8">Benefits</h2>
            <div class="grid md:grid-cols-3 gap-6">
              ${['Medical Assistance', 'Educational Support', 'Legal Aid', 'Livelihood Programs', 'Solo Parent Leave', 'Priority Services'].map(b => html`
                <div class="bg-white rounded-lg p-4 shadow">
                  <h3 class="font-bold text-gray-800">${b}</h3>
                </div>
              `)}
            </div>
          </div>
        </section>

        <footer class="bg-gray-900 text-white py-8 text-center">
          <p class="text-gray-400">© ${new Date().getFullYear()} Barangay Solo Parent Information System</p>
        </footer>
      </div>
    `;

    const Login = () => {
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      const [error, setError] = useState('');
      const [loading, setLoading] = useState(false);

      const handleSubmit = async (e) => {
        e.preventDefault();
        setLoading(true);
        setError('');
        try {
          const data = await api.auth.login({ email, password });
          localStorage.setItem('token', data.token);
          localStorage.setItem('user', JSON.stringify(data.user));
          window.location.href = data.user.role === 'applicant' ? '/apply' : '/dashboard';
        } catch (err) {
          setError(err.message);
        } finally {
          setLoading(false);
        }
      };

      return html`
        <div class="min-h-screen bg-gray-50 flex items-center justify-center p-4">
          <div class="bg-white rounded-xl shadow-lg p-8 w-full max-w-md">
            <div class="text-center mb-6">
              <div class="w-16 h-16 bg-blue-600 rounded-full flex items-center justify-center mx-auto mb-4">
                <span class="text-white font-bold text-2xl">SP</span>
              </div>
              <h1 class="text-2xl font-bold">Welcome Back</h1>
            </div>
            ${error && html`<div class="bg-red-100 text-red-700 px-4 py-2 rounded-lg mb-4">${error}</div>`}
            <form onSubmit="${handleSubmit}" class="space-y-4">
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                <input type="email" value="${email}" onInput="${e => setEmail(e.target.value)}" class="input-field" required />
              </div>
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                <input type="password" value="${password}" onInput="${e => setPassword(e.target.value)}" class="input-field" required />
              </div>
              <button type="submit" disabled="${loading}" class="w-full bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700 font-medium ${loading ? 'opacity-50' : ''}">
                ${loading ? 'Loading...' : 'Sign In'}
              </button>
            </form>
            <p class="mt-4 text-center text-gray-600">Don't have an account? <a href="/register" class="text-blue-600 font-medium">Register here</a></p>
          </div>
        </div>
      `;
    };

    const Register = () => {
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      const [error, setError] = useState('');
      const [loading, setLoading] = useState(false);

      const handleSubmit = async (e) => {
        e.preventDefault();
        setLoading(true);
        setError('');
        try {
          const data = await api.auth.register({ email, password, confirmPassword: password });
          localStorage.setItem('token', data.token);
          localStorage.setItem('user', JSON.stringify(data.user));
          window.location.href = '/apply';
        } catch (err) {
          setError(err.message);
        } finally {
          setLoading(false);
        }
      };

      return html`
        <div class="min-h-screen bg-gray-50 flex items-center justify-center p-4">
          <div class="bg-white rounded-xl shadow-lg p-8 w-full max-w-md">
            <div class="text-center mb-6">
              <div class="w-16 h-16 bg-blue-600 rounded-full flex items-center justify-center mx-auto mb-4">
                <span class="text-white font-bold text-2xl">SP</span>
              </div>
              <h1 class="text-2xl font-bold">Create Account</h1>
            </div>
            ${error && html`<div class="bg-red-100 text-red-700 px-4 py-2 rounded-lg mb-4">${error}</div>`}
            <form onSubmit="${handleSubmit}" class="space-y-4">
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                <input type="email" value="${email}" onInput="${e => setEmail(e.target.value)}" class="input-field" required />
              </div>
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                <input type="password" value="${password}" onInput="${e => setPassword(e.target.value)}" class="input-field" minLength="6" required />
              </div>
              <button type="submit" disabled="${loading}" class="w-full bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700 font-medium ${loading ? 'opacity-50' : ''}">
                ${loading ? 'Loading...' : 'Create Account'}
              </button>
            </form>
            <p class="mt-4 text-center text-gray-600">Already have an account? <a href="/login" class="text-blue-600 font-medium">Login</a></p>
          </div>
        </div>
      `;
    };

    const Apply = ({ onLogout }) => {
      const [form, setForm] = useState({
        application_type: 'new', last_name: '', first_name: '', middle_name: '', age: '', sex: '', birthdate: '',
        birth_place: '', address: '', contact_number: '', civil_status: '', number_of_dependents: 0,
        educational_attainment: 'None', purpose_of_application: '', employment_type: 'Unemployed',
        total_monthly_income: 0, type_of_occupancy: 'Own House', classification: '',
        member_4ps: false, member_ip: false, member_philhealth: false, member_sss: false, member_gsis: false,
        member_pagibig: false, comelec_registered: 'No', guardian_name: '', guardian_relation: '',
        guardian_contact: '', zone_leader_name: '', zone_leader_contact: ''
      });
      const [family, setFamily] = useState([{ name: '', relation: '', age: '', occupation: '' }]);
      const [error, setError] = useState('');
      const [loading, setLoading] = useState(false);
      const [success, setSuccess] = useState(false);

      const setField = (field, value) => setForm(prev => ({ ...prev, [field]: value }));

      const addFamily = () => setFamily(prev => [...prev, { name: '', relation: '', age: '', occupation: '' }]);
      const removeFamily = (i) => setFamily(prev => prev.filter((_, idx) => idx !== i));
      const setFamilyField = (i, field, value) => {
        const updated = [...family];
        updated[i][field] = value;
        setFamily(updated);
      };

      const handleSubmit = async (e) => {
        e.preventDefault();
        setLoading(true);
        setError('');
        try {
          await api.applicants.create({ ...form, family_members: family });
          setSuccess(true);
          setTimeout(() => window.location.href = '/', 2000);
        } catch (err) {
          setError(err.message);
        } finally {
          setLoading(false);
        }
      };

      if (success) {
        return html`
          <div class="min-h-screen bg-gray-50 flex items-center justify-center">
            <div class="bg-white rounded-xl shadow-lg p-8 text-center">
              <div class="w-16 h-16 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-4">
                <span class="text-green-600 text-3xl">✓</span>
              </div>
              <h2 class="text-2xl font-bold text-gray-800 mb-2">Application Submitted!</h2>
              <p class="text-gray-600">Redirecting...</p>
            </div>
          </div>
        `;
      }

      return html`
        <div>
          <${Navbar} user="${true}" onLogout="${onLogout}" />
          <div class="max-w-4xl mx-auto p-6">
            <h1 class="text-2xl font-bold mb-6">Solo Parent Application</h1>
            ${error && html`<div class="bg-red-100 text-red-700 px-4 py-2 rounded-lg mb-4">${error}</div>`}
            <form onSubmit="${handleSubmit}" class="space-y-8">
              
              <div class="bg-white rounded-xl shadow p-6">
                <h2 class="text-lg font-bold mb-4 border-b pb-2">Personal Information</h2>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                  <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Application Type</label>
                    <select value="${form.application_type}" onChange="${e => setField('application_type', e.target.value)}" class="input-field">
                      <option value="new">New Application</option>
                      <option value="renewal">Renewal</option>
                    </select>
                  </div>
                  <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Last Name *</label>
                    <input value="${form.last_name}" onInput="${e => setField('last_name', e.target.value)}" class="input-field" required />
                  </div>
                  <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">First Name *</label>
                    <input value="${form.first_name}" onInput="${e => setField('first_name', e.target.value)}" class="input-field" required />
                  </div>
                  <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Middle Name</label>
                    <input value="${form.middle_name}" onInput="${e => setField('middle_name', e.target.value)}" class="input-field" />
                  </div>
                  <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Age *</label>
                    <input type="number" value="${form.age}" onInput="${e => setField('age', e.target.value)}" class="input-field" required />
                  </div>
                  <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Sex *</label>
                    <select value="${form.sex}" onChange="${e => setField('sex', e.target.value)}" class="input-field" required>
                      <option value="">Select...</option>
                      <option value="Male">Male</option>
                      <option value="Female">Female</option>
                    </select>
                  </div>
                  <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Birthdate *</label>
                    <input type="date" value="${form.birthdate}" onInput="${e => setField('birthdate', e.target.value)}" class="input-field" required />
                  </div>
                  <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Birth Place *</label>
                    <input value="${form.birth_place}" onInput="${e => setField('birth_place', e.target.value)}" class="input-field" required />
                  </div>
                  <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Contact Number *</label>
                    <input value="${form.contact_number}" onInput="${e => setField('contact_number', e.target.value)}" class="input-field" required />
                  </div>
                </div>
                <div class="mt-4">
                  <label class="block text-sm font-medium text-gray-700 mb-1">Address *</label>
                  <textarea value="${form.address}" onInput="${e => setField('address', e.target.value)}" class="input-field" rows="2" required></textarea>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mt-4">
                  <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Civil Status *</label>
                    <select value="${form.civil_status}" onChange="${e => setField('civil_status', e.target.value)}" class="input-field" required>
                      <option value="">Select...</option>
                      <option value="Widow">Widow</option>
                      <option value="Separated">Separated</option>
                      <option value="Unwed">Unwed</option>
                      <option value="Others">Others</option>
                    </select>
                  </div>
                  <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Classification *</label>
                    <select value="${form.classification}" onChange="${e => setField('classification', e.target.value)}" class="input-field" required>
                      <option value="">Select...</option>
                      <option value="Unwed">Unwed</option>
                      <option value="Widow">Widow</option>
                      <option value="Widower">Widower</option>
                      <option value="Separated">Separated</option>
                      <option value="Annulled">Annulled</option>
                      <option value="Foster Parent">Foster Parent</option>
                      <option value="Guardian">Guardian</option>
                    </select>
                  </div>
                  <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Purpose *</label>
                    <select value="${form.purpose_of_application}" onChange="${e => setField('purpose_of_application', e.target.value)}" class="input-field" required>
                      <option value="">Select...</option>
                      <option value="Educational Assistance">Educational Assistance</option>
                      <option value="Livelihood Assistance">Livelihood Assistance</option>
                      <option value="Solo Parent Leave">Solo Parent Leave</option>
                      <option value="Others">Others</option>
                    </select>
                  </div>
                </div>
              </div>

              <div class="bg-white rounded-xl shadow p-6">
                <h2 class="text-lg font-bold mb-4 border-b pb-2">Employment</h2>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                  <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Employment Type</label>
                    <select value="${form.employment_type}" onChange="${e => setField('employment_type', e.target.value)}" class="input-field">
                      <option value="Unemployed">Unemployed</option>
                      <option value="Private">Private</option>
                      <option value="Government">Government</option>
                      <option value="Self-employed">Self-employed</option>
                    </select>
                  </div>
                  <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Monthly Income</label>
                    <input type="number" value="${form.total_monthly_income}" onInput="${e => setField('total_monthly_income', e.target.value)}" class="input-field" />
                  </div>
                  <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Occupancy</label>
                    <select value="${form.type_of_occupancy}" onChange="${e => setField('type_of_occupancy', e.target.value)}" class="input-field">
                      <option value="Own House">Own House</option>
                      <option value="Renter">Renter</option>
                      <option value="Living with Parents">Living with Parents</option>
                    </select>
                  </div>
                </div>
              </div>

              <div class="bg-white rounded-xl shadow p-6">
                <h2 class="text-lg font-bold mb-4 border-b pb-2">Memberships</h2>
                <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                  <label class="flex items-center gap-2"><input type="checkbox" checked="${form.member_4ps}" onChange="${e => setField('member_4ps', e.target.checked)}" /> 4P's</label>
                  <label class="flex items-center gap-2"><input type="checkbox" checked="${form.member_ip}" onChange="${e => setField('member_ip', e.target.checked)}" /> IP's</label>
                  <label class="flex items-center gap-2"><input type="checkbox" checked="${form.member_philhealth}" onChange="${e => setField('member_philhealth', e.target.checked)}" /> PhilHealth</label>
                  <label class="flex items-center gap-2"><input type="checkbox" checked="${form.member_sss}" onChange="${e => setField('member_sss', e.target.checked)}" /> SSS</label>
                  <label class="flex items-center gap-2"><input type="checkbox" checked="${form.member_gsis}" onChange="${e => setField('member_gsis', e.target.checked)}" /> GSIS</label>
                  <label class="flex items-center gap-2"><input type="checkbox" checked="${form.member_pagibig}" onChange="${e => setField('member_pagibig', e.target.checked)}" /> PAG-IBIG</label>
                </div>
              </div>

              <div class="bg-white rounded-xl shadow p-6">
                <h2 class="text-lg font-bold mb-4 border-b pb-2">Guardian / Contact</h2>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                  <div><label class="block text-sm font-medium text-gray-700 mb-1">Name</label><input value="${form.guardian_name}" onInput="${e => setField('guardian_name', e.target.value)}" class="input-field" /></div>
                  <div><label class="block text-sm font-medium text-gray-700 mb-1">Relation</label><input value="${form.guardian_relation}" onInput="${e => setField('guardian_relation', e.target.value)}" class="input-field" /></div>
                  <div><label class="block text-sm font-medium text-gray-700 mb-1">Contact</label><input value="${form.guardian_contact}" onInput="${e => setField('guardian_contact', e.target.value)}" class="input-field" /></div>
                </div>
              </div>

              <div class="bg-white rounded-xl shadow p-6">
                <div class="flex items-center justify-between mb-4">
                  <h2 class="text-lg font-bold border-b pb-2">Family Composition</h2>
                  <button type="button" onClick="${addFamily}" class="bg-blue-100 text-blue-600 px-4 py-2 rounded-lg text-sm font-medium">+ Add Member</button>
                </div>
                <table class="w-full text-sm">
                  <thead class="bg-gray-50">
                    <tr class="text-left">
                      <th class="px-3 py-2">Name</th>
                      <th class="px-3 py-2">Relation</th>
                      <th class="px-3 py-2">Age</th>
                      <th class="px-3 py-2">Occupation</th>
                      <th class="w-10"></th>
                    </tr>
                  </thead>
                  <tbody>
                    ${family.map((m, i) => html`
                      <tr class="border-t">
                        <td class="px-3 py-2"><input value="${m.name}" onInput="${e => setFamilyField(i, 'name', e.target.value)}" class="input-field text-sm py-1" /></td>
                        <td class="px-3 py-2"><input value="${m.relation}" onInput="${e => setFamilyField(i, 'relation', e.target.value)}" class="input-field text-sm py-1" /></td>
                        <td class="px-3 py-2"><input type="number" value="${m.age}" onInput="${e => setFamilyField(i, 'age', e.target.value)}" class="input-field text-sm py-1 w-20" /></td>
                        <td class="px-3 py-2"><input value="${m.occupation}" onInput="${e => setFamilyField(i, 'occupation', e.target.value)}" class="input-field text-sm py-1" /></td>
                        <td class="px-3 py-2">
                          <button type="button" onClick="${() => removeFamily(i)}" class="text-red-500 hover:text-red-700 text-lg">×</button>
                        </td>
                      </tr>
                    `)}
                  </tbody>
                </table>
              </div>

              <div class="flex justify-end gap-4">
                <a href="/" class="px-6 py-2 border-2 border-gray-300 text-gray-600 rounded-lg">Cancel</a>
                <button type="submit" disabled="${loading}" class="btn-primary ${loading ? 'opacity-50' : ''}">
                  ${loading ? 'Submitting...' : 'Submit Application'}
                </button>
              </div>
            </form>
          </div>
        </div>
      `;
    };

    const Dashboard = () => {
      const [stats, setStats] = useState(null);
      const [loading, setLoading] = useState(true);
      const [applicants, setApplicants] = useState([]);

      useEffect(() => {
        api.dashboard.getStats().then(data => { setStats(data); setLoading(false); }).catch(() => setLoading(false));
        api.applicants.getAll().then(data => setApplicants(data.applicants || [])).catch(() => {});
      }, []);

      const updateStatus = async (id, status) => {
        if (!confirm('Update status to ' + status + '?')) return;
        try {
          await api.admin.updateStatus(id, { status });
          const data = await api.applicants.getAll();
          setApplicants(data.applicants || []);
        } catch (err) {
          alert(err.message);
        }
      };

      return html`
        <div class="min-h-screen bg-gray-50">
          <header class="bg-white shadow-sm px-6 py-4 flex items-center justify-between">
            <h1 class="text-xl font-bold">Admin Dashboard</h1>
            <a href="/" onClick="${() => { localStorage.clear(); window.location.href = '/'; }}" class="text-red-600 hover:text-red-700">Logout</a>
          </header>
          <main class="max-w-6xl mx-auto p-6">
            ${loading ? html`<div class="text-center py-12">Loading...</div>` : html`
              <div class="grid grid-cols-2 md:grid-cols-4 gap-6 mb-8">
                ${[['Total', stats?.overview?.total || 0, 'text-blue-600'], ['Approved', stats?.overview?.approved || 0, 'text-green-600'], ['Pending', stats?.overview?.pending || 0, 'text-yellow-600'], ['Rejected', stats?.overview?.rejected || 0, 'text-red-600']].map(([title, val, color]) => html`
                  <div class="bg-white rounded-xl shadow p-6">
                    <p class="text-sm text-gray-500">${title}</p>
                    <p class="text-3xl font-bold ${color}">${val}</p>
                  </div>
                `)}
              </div>
              <div class="bg-white rounded-xl shadow p-6">
                <h3 class="font-bold mb-4">All Applications</h3>
                <div class="overflow-x-auto">
                  <table class="w-full text-left text-sm">
                    <thead class="bg-gray-50">
                      <tr class="text-gray-500">
                        <th class="pb-2 px-2">Name</th>
                        <th class="pb-2 px-2">Classification</th>
                        <th class="pb-2 px-2">Purpose</th>
                        <th class="pb-2 px-2">Status</th>
                        <th class="pb-2 px-2">Actions</th>
                      </tr>
                    </thead>
                    <tbody class="divide-y">
                      ${applicants.map(app => html`
                        <tr>
                          <td class="py-2 px-2">${app.last_name}, ${app.first_name}</td>
                          <td class="py-2 px-2">${app.classification}</td>
                          <td class="py-2 px-2">${app.purpose_of_application}</td>
                          <td class="py-2 px-2">
                            <span class="px-2 py-1 rounded-full text-xs font-medium ${app.status === 'approved' ? 'bg-green-100 text-green-700' : app.status === 'pending' ? 'bg-yellow-100 text-yellow-700' : 'bg-red-100 text-red-700'}">${app.status}</span>
                          </td>
                          <td class="py-2 px-2">
                            <button onClick="${() => updateStatus(app.id, 'approved')}" class="text-green-600 hover:text-green-700 text-sm mr-2">Approve</button>
                            <button onClick="${() => updateStatus(app.id, 'rejected')}" class="text-red-600 hover:text-red-700 text-sm">Reject</button>
                          </td>
                        </tr>
                      `)}
                      ${applicants.length === 0 ? html`<tr><td colspan="5" class="py-4 text-center text-gray-500">No applications yet</td></tr>` : ''}
                    </tbody>
                  </table>
                </div>
              </div>
            `}
          </main>
        </div>
      `;
    };

    const App = () => {
      const [user, setUser] = useState(null);
      const [loading, setLoading] = useState(true);
      const path = window.location.pathname;

      useEffect(() => {
        const token = localStorage.getItem('token');
        if (token) {
          api.auth.me().then(data => { setUser(data); setLoading(false); }).catch(() => { localStorage.removeItem('token'); localStorage.removeItem('user'); setLoading(false); });
        } else {
          setLoading(false);
        }
      }, []);

      const logout = () => {
        localStorage.clear();
        window.location.href = '/';
      };

      if (loading) {
        return html`<div class="min-h-screen flex items-center justify-center"><div class="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-600"></div></div>`;
      }

      if (path === '/login') return html`<${Login} />`;
      if (path === '/register') return html`<${Register} />`;
      if (path === '/apply') return html`<${Apply} onLogout="${logout}" />`;
      if (path === '/dashboard') return html`<${Dashboard} />`;
      return html`<${Home} user="${user}" onLogout="${logout}" />`;
    };

    render(html`<${App} />`, document.getElementById('app'));
  </script>
</body>
</html>
