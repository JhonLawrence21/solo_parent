<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Barangay Solo Parent Information System</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            primary: { 600: '#2563eb', 700: '#1d4ed8' },
            secondary: { 500: '#eab308', 600: '#ca8a04' }
          }
        }
      }
    }
  </script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: system-ui, -apple-system, sans-serif; }
    .btn-primary { background: #2563eb; color: white; padding: 10px 24px; border-radius: 8px; font-weight: 500; }
    .btn-primary:hover { background: #1d4ed8; }
    .btn-secondary { background: #eab308; color: white; padding: 10px 24px; border-radius: 8px; font-weight: 500; }
    .btn-secondary:hover { background: #ca8a04; }
    .input-field { width: 100%; padding: 10px 16px; border: 1px solid #d1d5db; border-radius: 8px; }
    .input-field:focus { outline: none; border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59,130,246,0.1); }
  </style>
</head>
<body class="bg-gray-50">
  <div id="app">
    <div class="min-h-screen flex items-center justify-center">
      <div class="text-center">
        <div class="w-16 h-16 bg-blue-600 rounded-full flex items-center justify-center mx-auto mb-4">
          <span class="text-white font-bold text-2xl">SP</span>
        </div>
        <h1 class="text-2xl font-bold text-gray-800 mb-2">Solo Parent Information System</h1>
        <p class="text-gray-600 mb-4">Loading...</p>
        <div class="animate-spin rounded-full h-10 w-10 border-b-2 border-blue-600 mx-auto"></div>
      </div>
    </div>
  </div>

  <script type="module">
    import { render, h } from 'https://esm.sh/preact@10.19.3';
    import { useState, useEffect } from 'https://esm.sh/preact@10.19.3/hooks';
    import htm from 'https://esm.sh/htm@3.1.1';

    const html = htm.bind(h);

    const api = {
      async request(endpoint, options = {}) {
        const token = localStorage.getItem('token');
        const headers = { 'Content-Type': 'application/json', ...options.headers };
        if (token) headers['Authorization'] = 'Bearer ' + token;
        const res = await fetch('/api' + endpoint, { ...options, headers });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Request failed');
        return data;
      },
      auth: {
        login: (data) => api.request('/auth/login', { method: 'POST', body: JSON.stringify(data) }),
        register: (data) => api.request('/auth/register', { method: 'POST', body: JSON.stringify(data) }),
        me: () => api.request('/auth/me')
      },
      applicants: {
        create: (data) => api.request('/applicants', { method: 'POST', body: JSON.stringify(data) }),
        getAll: () => api.request('/applicants'),
        getOne: (id) => api.request('/applicants/' + id)
      },
      admin: {
        updateStatus: (id, data) => api.request('/admin/applicants/' + id + '/status', { method: 'PUT', body: JSON.stringify(data) })
      },
      dashboard: { getStats: () => api.request('/dashboard') }
    };

    const exportToCSV = (applicants, filename = 'applicants.csv') => {
      const headers = ['ID', 'Application Type', 'ID Number', 'Expiry Date', 'Last Name', 'First Name', 'Middle Name', 'Age', 'Sex', 'Birthdate', 'Birth Place', 'Address', 'Contact Number', 'Civil Status', 'Number of Dependents', 'Facebook Account', 'Educational Attainment', 'Purpose of Application', 'Employment Type', 'Type of Employment', 'Other Source of Income', 'Total Monthly Income', 'Type of Occupancy', 'Classification', '4P\'s', 'IP\'s', 'PhilHealth', 'SSS', 'GSIS', 'PAG-IBIG', 'COMELEC Registered', 'Guardian Name', 'Guardian Relation', 'Guardian Contact', 'Zone Leader Name', 'Zone Leader Contact', 'Status', 'Date Applied'];
      const rows = applicants.map(app => [
        app.id, app.application_type, app.id_number || '', app.expiry_date || '', app.last_name || '', app.first_name || '', app.middle_name || '', app.age || '', app.sex || '', app.birthdate || '', app.birth_place || '', app.address || '', app.contact_number || '', app.civil_status || '', app.number_of_dependents || '', app.facebook_account || '', app.educational_attainment || '', app.purpose_of_application || '', app.employment_type || '', app.type_of_employment || '', app.other_source_of_income || '', app.total_monthly_income || '', app.type_of_occupancy || '', app.classification || '', app.member_4ps ? 'Yes' : 'No', app.member_ip ? 'Yes' : 'No', app.member_philhealth ? 'Yes' : 'No', app.member_sss ? 'Yes' : 'No', app.member_gsis ? 'Yes' : 'No', app.member_pagibig ? 'Yes' : 'No', app.comelec_registered === true || app.comelec_registered === 'Yes' ? 'Yes' : 'No', app.guardian_name || '', app.guardian_relation || '', app.guardian_contact || '', app.zone_leader_name || '', app.zone_leader_contact || '', app.status || '', app.created_at ? new Date(app.created_at).toLocaleDateString() : ''
      ].map(v => '"' + String(v).replace(/"/g, '""') + '"').join(','));
      const csv = [headers.join(','), ...rows].join('\n');
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = filename;
      link.click();
    };

    const safeText = (v) => {
      if (v === null || v === undefined) return '';
      if (typeof v === 'boolean') return v ? 'Yes' : 'No';
      return String(v);
    };

    const boolPill = (v) => {
      const on = !!v;
      return html`<span class="px-2 py-1 rounded-full text-xs font-medium ${on ? 'bg-green-100 text-green-700' : 'bg-gray-100 text-gray-600'}">${on ? 'Yes' : 'No'}</span>`;
    };

    const Navbar = ({ user, onLogout }) => {
      const [menuOpen, setMenuOpen] = useState(false);
      return html`
        <header class="bg-white shadow-sm sticky top-0 z-50">
          <nav class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
            <a href="/" class="flex items-center gap-2">
              <div class="w-10 h-10 md:w-12 md:h-12 bg-blue-600 rounded-full flex items-center justify-center">
                <span class="text-white font-bold text-sm md:text-lg">SP</span>
              </div>
              <div class="hidden sm:block">
                <h1 class="font-bold text-gray-800 text-sm md:text-base">Solo Parent</h1>
                <p class="text-xs text-gray-500">Barangay System</p>
              </div>
            </a>
            <button class="md:hidden p-2" onClick="${() => setMenuOpen(!menuOpen)}">
              <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="${menuOpen ? 'M6 18L18 6M6 6l12 12' : 'M4 6h16M4 12h16M4 18h16'}"></path>
              </svg>
            </button>
            <div class="${menuOpen ? 'absolute top-full left-0 right-0 bg-white shadow-lg py-4 px-4 flex flex-col gap-3' : 'hidden'} md:flex md:items-center md:gap-4">
              ${user ? html`
                <a href="/apply" class="text-gray-600 hover:text-blue-600 font-medium py-2" onClick="${() => setMenuOpen(false)}">Apply</a>
                <a href="/dashboard" class="text-gray-600 hover:text-blue-600 font-medium py-2" onClick="${() => setMenuOpen(false)}">Dashboard</a>
                <button onClick="${() => { setMenuOpen(false); onLogout(); }}" class="text-red-600 hover:text-red-700 py-2 text-left">Logout</button>
              ` : html`
                <a href="/login" class="text-gray-600 hover:text-blue-600 font-medium py-2" onClick="${() => setMenuOpen(false)}">Login</a>
                <a href="/register" class="btn-primary text-sm px-4 py-2 text-center" onClick="${() => setMenuOpen(false)}">Apply Now</a>
              `}
            </div>
          </nav>
        </header>
      `;
    };

    const Home = ({ user, onLogout }) => html`
      <div>
        <${Navbar} user="${user}" onLogout="${onLogout}" />
        
        <section class="bg-gradient-to-br from-blue-600 to-blue-800 text-white py-12 md:py-20">
          <div class="max-w-4xl mx-auto px-4 text-center">
            <h1 class="text-2xl md:text-4xl font-bold mb-3 md:mb-4">Barangay Solo Parent <span class="text-yellow-400">Information System</span></h1>
            <p class="text-base md:text-lg text-blue-100 mb-6 md:mb-8">Apply for Solo Parent ID online, track your application status, and access government benefits.</p>
            <a href="/register" class="btn-secondary inline-flex items-center gap-2 text-base md:text-lg px-6 md:px-8 py-2 md:py-3">Apply Now →</a>
          </div>
        </section>

        <section class="py-10 md:py-16 bg-white">
          <div class="max-w-4xl mx-auto px-4 text-center">
            <h2 class="text-2xl md:text-3xl font-bold text-gray-800 mb-6 md:mb-8">Requirements</h2>
            <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4 md:gap-6">
              ${['Valid ID', 'Barangay Certificate', 'Birth Certificate', '2x2 Photo', 'Supporting Docs', 'Application Form'].map(req => html`
                <div class="bg-gray-50 rounded-lg p-3 md:p-4 flex items-center gap-2 md:gap-3">
                  <div class="w-6 md:w-8 h-6 md:h-8 bg-blue-100 rounded-full flex items-center justify-center text-blue-600 text-sm">✓</div>
                  <span class="text-sm md:text-base">${req}</span>
                </div>
              `)}
            </div>
          </div>
        </section>

        <section class="py-10 md:py-16 bg-gray-50">
          <div class="max-w-4xl mx-auto px-4 text-center">
            <h2 class="text-2xl md:text-3xl font-bold text-gray-800 mb-6 md:mb-8">Benefits</h2>
            <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4 md:gap-6">
              ${['Medical Assistance', 'Educational Support', 'Legal Aid', 'Livelihood Programs', 'Solo Parent Leave', 'Priority Services'].map(b => html`
                <div class="bg-white rounded-lg p-4 shadow">
                  <h3 class="font-bold text-gray-800 text-sm md:text-base">${b}</h3>
                </div>
              `)}
            </div>
          </div>
        </section>

        <footer class="bg-gray-900 text-white py-6 md:py-8 text-center">
          <p class="text-gray-400 text-sm">© ${new Date().getFullYear()} Barangay Solo Parent Information System</p>
        </footer>
      </div>
    `;

    const Login = () => {
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      const [error, setError] = useState('');
      const [loading, setLoading] = useState(false);

      const handleSubmit = async (e) => {
        e.preventDefault();
        setLoading(true);
        setError('');
        try {
          const data = await api.auth.login({ email, password });
          localStorage.setItem('token', data.token);
          localStorage.setItem('user', JSON.stringify(data.user));
          window.location.href = data.user.role === 'applicant' ? '/apply' : '/dashboard';
        } catch (err) {
          setError(err.message);
        } finally {
          setLoading(false);
        }
      };

      return html`
        <div class="min-h-screen bg-gray-50 flex items-center justify-center p-4">
          <div class="bg-white rounded-xl shadow-lg p-6 md:p-8 w-full max-w-md">
            <div class="text-center mb-4 md:mb-6">
              <div class="w-12 h-12 md:w-16 md:h-16 bg-blue-600 rounded-full flex items-center justify-center mx-auto mb-3 md:mb-4">
                <span class="text-white font-bold text-xl md:text-2xl">SP</span>
              </div>
              <h1 class="text-xl md:text-2xl font-bold">Welcome Back</h1>
            </div>
            ${error && html`<div class="bg-red-100 text-red-700 px-4 py-2 rounded-lg mb-4">${error}</div>`}
            <form onSubmit="${handleSubmit}" class="space-y-4">
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                <input type="email" value="${email}" onInput="${e => setEmail(e.target.value)}" class="input-field" required />
              </div>
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                <input type="password" value="${password}" onInput="${e => setPassword(e.target.value)}" class="input-field" required />
              </div>
              <button type="submit" disabled="${loading}" class="w-full bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700 font-medium ${loading ? 'opacity-50' : ''}">
                ${loading ? 'Loading...' : 'Sign In'}
              </button>
            </form>
            <p class="mt-4 text-center text-gray-600">Don't have an account? <a href="/register" class="text-blue-600 font-medium">Register here</a></p>
          </div>
        </div>
      `;
    };

    const Register = () => {
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      const [error, setError] = useState('');
      const [loading, setLoading] = useState(false);

      const handleSubmit = async (e) => {
        e.preventDefault();
        setLoading(true);
        setError('');
        try {
          const data = await api.auth.register({ email, password, confirmPassword: password });
          localStorage.setItem('token', data.token);
          localStorage.setItem('user', JSON.stringify(data.user));
          window.location.href = '/apply';
        } catch (err) {
          setError(err.message);
        } finally {
          setLoading(false);
        }
      };

      return html`
        <div class="min-h-screen bg-gray-50 flex items-center justify-center p-4">
          <div class="bg-white rounded-xl shadow-lg p-6 md:p-8 w-full max-w-md">
            <div class="text-center mb-4 md:mb-6">
              <div class="w-12 h-12 md:w-16 md:h-16 bg-blue-600 rounded-full flex items-center justify-center mx-auto mb-3 md:mb-4">
                <span class="text-white font-bold text-xl md:text-2xl">SP</span>
              </div>
              <h1 class="text-xl md:text-2xl font-bold">Create Account</h1>
            </div>
            ${error && html`<div class="bg-red-100 text-red-700 px-4 py-2 rounded-lg mb-4">${error}</div>`}
            <form onSubmit="${handleSubmit}" class="space-y-4">
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                <input type="email" value="${email}" onInput="${e => setEmail(e.target.value)}" class="input-field" required />
              </div>
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                <input type="password" value="${password}" onInput="${e => setPassword(e.target.value)}" class="input-field" minLength="6" required />
              </div>
              <button type="submit" disabled="${loading}" class="w-full bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700 font-medium ${loading ? 'opacity-50' : ''}">
                ${loading ? 'Loading...' : 'Create Account'}
              </button>
            </form>
            <p class="mt-4 text-center text-gray-600">Already have an account? <a href="/login" class="text-blue-600 font-medium">Login</a></p>
          </div>
        </div>
      `;
    };

    const Apply = ({ onLogout }) => {
      const [form, setForm] = useState({
        application_type: 'new', id_number: '', expiry_date: '', last_name: '', first_name: '', middle_name: '',
        age: '', sex: '', birthdate: '', birth_place: '', address: '', contact_number: '', civil_status: '',
        number_of_dependents: 0, facebook_account: '', educational_attainment: 'None',
        purpose_of_application: '', employment_type: 'Unemployed', type_of_employment: '',
        other_source_of_income: '', total_monthly_income: 0, type_of_occupancy: 'Own House', classification: '',
        member_4ps: false, member_ip: false, member_philhealth: false, member_sss: false, member_gsis: false,
        member_pagibig: false, comelec_registered: 'No', guardian_name: '', guardian_relation: '',
        guardian_contact: '', zone_leader_name: '', zone_leader_contact: ''
      });
      const [family, setFamily] = useState([{ name: '', relation: '', age: '', occupation: '' }]);
      const [error, setError] = useState('');
      const [loading, setLoading] = useState(false);
      const [success, setSuccess] = useState(false);

      const setField = (field, value) => setForm(prev => ({ ...prev, [field]: value }));

      const addFamily = () => setFamily(prev => [...prev, { name: '', relation: '', age: '', occupation: '' }]);
      const removeFamily = (i) => setFamily(prev => prev.filter((_, idx) => idx !== i));
      const setFamilyField = (i, field, value) => {
        const updated = [...family];
        updated[i][field] = value;
        setFamily(updated);
      };

      const handleSubmit = async (e) => {
        e.preventDefault();
        setLoading(true);
        setError('');
        try {
          await api.applicants.create({ ...form, family_members: family });
          setSuccess(true);
          setTimeout(() => window.location.href = '/', 2000);
        } catch (err) {
          setError(err.message);
        } finally {
          setLoading(false);
        }
      };

      if (success) {
        return html`
          <div class="min-h-screen bg-gray-50 flex items-center justify-center">
            <div class="bg-white rounded-xl shadow-lg p-8 text-center">
              <div class="w-16 h-16 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-4">
                <span class="text-green-600 text-3xl">✓</span>
              </div>
              <h2 class="text-2xl font-bold text-gray-800 mb-2">Application Submitted!</h2>
              <p class="text-gray-600">Redirecting...</p>
            </div>
          </div>
        `;
      }

      return html`
        <div>
          <${Navbar} user="${true}" onLogout="${onLogout}" />
          <div class="max-w-4xl mx-auto p-3 md:p-6">
            <h1 class="text-xl md:text-2xl font-bold mb-4 md:mb-6">Solo Parent Application</h1>
            ${error && html`<div class="bg-red-100 text-red-700 px-4 py-2 rounded-lg mb-4">${error}</div>`}
            <form onSubmit="${handleSubmit}" class="space-y-8">
              
              <div class="bg-white rounded-xl shadow p-4 md:p-6">
                <h2 class="text-base md:text-lg font-bold mb-3 md:mb-4 border-b pb-2">Personal Information</h2>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                  <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Application Type</label>
                    <select value="${form.application_type}" onChange="${e => setField('application_type', e.target.value)}" class="input-field">
                      <option value="new">New Application</option>
                      <option value="renewal">Renewal</option>
                    </select>
                  </div>
                  <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">ID Number</label>
                    <input value="${form.id_number}" onInput="${e => setField('id_number', e.target.value)}" class="input-field" placeholder="Auto-generated" />
                  </div>
                  <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Expiry Date</label>
                    <input type="date" value="${form.expiry_date}" onInput="${e => setField('expiry_date', e.target.value)}" class="input-field" />
                  </div>
                  <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Last Name *</label>
                    <input value="${form.last_name}" onInput="${e => setField('last_name', e.target.value)}" class="input-field" required />
                  </div>
                  <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">First Name *</label>
                    <input value="${form.first_name}" onInput="${e => setField('first_name', e.target.value)}" class="input-field" required />
                  </div>
                  <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Middle Name</label>
                    <input value="${form.middle_name}" onInput="${e => setField('middle_name', e.target.value)}" class="input-field" />
                  </div>
                  <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Age *</label>
                    <input type="number" value="${form.age}" onInput="${e => setField('age', e.target.value)}" class="input-field" required />
                  </div>
                  <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Sex *</label>
                    <select value="${form.sex}" onChange="${e => setField('sex', e.target.value)}" class="input-field" required>
                      <option value="">Select...</option>
                      <option value="Male">Male</option>
                      <option value="Female">Female</option>
                    </select>
                  </div>
                  <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Birthdate *</label>
                    <input type="date" value="${form.birthdate}" onInput="${e => setField('birthdate', e.target.value)}" class="input-field" required />
                  </div>
                  <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Birth Place *</label>
                    <input value="${form.birth_place}" onInput="${e => setField('birth_place', e.target.value)}" class="input-field" required />
                  </div>
                  <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Contact Number *</label>
                    <input value="${form.contact_number}" onInput="${e => setField('contact_number', e.target.value)}" class="input-field" required />
                  </div>
                  <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Facebook Account</label>
                    <input value="${form.facebook_account}" onInput="${e => setField('facebook_account', e.target.value)}" class="input-field" placeholder="facebook.com/username" />
                  </div>
                </div>
                <div class="mt-4">
                  <label class="block text-sm font-medium text-gray-700 mb-1">Address *</label>
                  <textarea value="${form.address}" onInput="${e => setField('address', e.target.value)}" class="input-field" rows="2" required></textarea>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mt-4">
                  <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Civil Status *</label>
                    <select value="${form.civil_status}" onChange="${e => setField('civil_status', e.target.value)}" class="input-field" required>
                      <option value="">Select...</option>
                      <option value="Widow">Widow</option>
                      <option value="Separated">Separated</option>
                      <option value="Unwed">Unwed</option>
                      <option value="Others">Others</option>
                    </select>
                  </div>
                  <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Number of Dependents</label>
                    <input type="number" value="${form.number_of_dependents}" onInput="${e => setField('number_of_dependents', e.target.value)}" class="input-field" min="0" />
                  </div>
                  <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Educational Attainment</label>
                    <select value="${form.educational_attainment}" onChange="${e => setField('educational_attainment', e.target.value)}" class="input-field">
                      <option value="None">None</option>
                      <option value="Elementary">Elementary</option>
                      <option value="High School">High School</option>
                      <option value="College">College</option>
                      <option value="Vocational">Vocational</option>
                      <option value="Masteral">Masteral</option>
                      <option value="Doctorate">Doctorate</option>
                    </select>
                  </div>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mt-4">
                  <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Classification *</label>
                    <select value="${form.classification}" onChange="${e => setField('classification', e.target.value)}" class="input-field" required>
                      <option value="">Select...</option>
                      <option value="Unwed">Unwed</option>
                      <option value="Widow">Widow</option>
                      <option value="Widower">Widower</option>
                      <option value="Separated">Separated</option>
                      <option value="Annulled">Annulled</option>
                      <option value="Foster Parent">Foster Parent</option>
                      <option value="Guardian">Guardian</option>
                    </select>
                  </div>

                    </select>

              <div class="bg-white rounded-xl shadow p-4 md:p-6">

                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">

                      <option value="Government">Government</option>
                      <option value="Self-employed">Self-employed</option>
                    </select>
                  </div>
                  <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Type of Employment</label>
                    <input value="${form.type_of_employment}" onInput="${e => setField('type_of_employment', e.target.value)}" class="input-field" placeholder="e.g., Full-time, Part-time, Contract" />
                  </div>
                  <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Other Source of Income</label>
                    <input value="${form.other_source_of_income}" onInput="${e => setField('other_source_of_income', e.target.value)}" class="input-field" placeholder="e.g., Rental, Business" />
                  </div>
                  <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Total Monthly Income (PHP)</label>
                    <input type="number" value="${form.total_monthly_income}" onInput="${e => setField('total_monthly_income', e.target.value)}" class="input-field" min="0" />
                  </div>
                  <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Type of Occupancy</label>
                    <select value="${form.type_of_occupancy}" onChange="${e => setField('type_of_occupancy', e.target.value)}" class="input-field">
                      <option value="Own House">Own House</option>
                      <option value="Renter">Renter</option>
                      <option value="Living with Parents">Living with Parents</option>
                      <option value="Homeless">Homeless</option>
                    </select>
                  </div>

              </div>

              <div class="bg-white rounded-xl shadow p-4 md:p-6">
                <h2 class="text-base md:text-lg font-bold mb-3 md:mb-4 border-b pb-2">Memberships</h2>
                <div class="grid grid-cols-2 md:grid-cols-4 gap-2 md:gap-4">
                  <label class="flex items-center gap-2"><input type="checkbox" checked="${form.member_4ps}" onChange="${e => setField('member_4ps', e.target.checked)}" /> 4P's</label>
                  <label class="flex items-center gap-2"><input type="checkbox" checked="${form.member_ip}" onChange="${e => setField('member_ip', e.target.checked)}" /> IP's</label>
                  <label class="flex items-center gap-2"><input type="checkbox" checked="${form.member_philhealth}" onChange="${e => setField('member_philhealth', e.target.checked)}" /> PhilHealth</label>
                  <label class="flex items-center gap-2"><input type="checkbox" checked="${form.member_sss}" onChange="${e => setField('member_sss', e.target.checked)}" /> SSS</label>
                  <label class="flex items-center gap-2"><input type="checkbox" checked="${form.member_gsis}" onChange="${e => setField('member_gsis', e.target.checked)}" /> GSIS</label>
                  <label class="flex items-center gap-2"><input type="checkbox" checked="${form.member_pagibig}" onChange="${e => setField('member_pagibig', e.target.checked)}" /> PAG-IBIG</label>
                </div>
              </div>

              <div class="bg-white rounded-xl shadow p-4 md:p-6">
                <h2 class="text-base md:text-lg font-bold mb-3 md:mb-4 border-b pb-2">Guardian / Contact</h2>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                  <div><label class="block text-sm font-medium text-gray-700 mb-1">Name</label><input value="${form.guardian_name}" onInput="${e => setField('guardian_name', e.target.value)}" class="input-field" /></div>
                  <div><label class="block text-sm font-medium text-gray-700 mb-1">Relation</label><input value="${form.guardian_relation}" onInput="${e => setField('guardian_relation', e.target.value)}" class="input-field" /></div>
                  <div><label class="block text-sm font-medium text-gray-700 mb-1">Contact</label><input value="${form.guardian_contact}" onInput="${e => setField('guardian_contact', e.target.value)}" class="input-field" /></div>
                </div>
              </div>

              <div class="bg-white rounded-xl shadow p-4 md:p-6">
                <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-2 mb-3 md:mb-4">
                  <h2 class="text-base md:text-lg font-bold border-b pb-2">Family Composition</h2>
                  <button type="button" onClick="${addFamily}" class="bg-blue-100 text-blue-600 px-3 md:px-4 py-1.5 md:py-2 rounded-lg text-xs md:text-sm font-medium self-start sm:self-center">+ Add Member</button>
                </div>
                <div class="overflow-x-auto">
                <table class="w-full text-xs md:text-sm">
                  <thead class="bg-gray-50">
                    <tr class="text-left">
                      <th class="px-2 py-2">Name</th>
                      <th class="px-2 py-2">Relation</th>
                      <th class="px-2 py-2">Age</th>
                      <th class="px-2 py-2">Occupation</th>
                      <th class="w-8"></th>
                    </tr>
                  </thead>
                  <tbody>
                    ${family.map((m, i) => html`
                      <tr class="border-t">
                        <td class="px-1 py-1"><input value="${m.name}" onInput="${e => setFamilyField(i, 'name', e.target.value)}" class="input-field text-xs py-1" /></td>
                        <td class="px-1 py-1"><input value="${m.relation}" onInput="${e => setFamilyField(i, 'relation', e.target.value)}" class="input-field text-xs py-1" /></td>
                        <td class="px-1 py-1"><input type="number" value="${m.age}" onInput="${e => setFamilyField(i, 'age', e.target.value)}" class="input-field text-xs py-1 w-14 md:w-16" /></td>
                        <td class="px-1 py-1"><input value="${m.occupation}" onInput="${e => setFamilyField(i, 'occupation', e.target.value)}" class="input-field text-xs py-1" /></td>
                        <td class="px-1 py-1">
                          <button type="button" onClick="${() => removeFamily(i)}" class="text-red-500 hover:text-red-700 text-lg">×</button>

              </div>

              <div class="flex flex-col sm:flex-row justify-end gap-3 sm:gap-4 mt-6">

                  ${loading ? 'Submitting...' : 'Submit Application'}
                </button>

          </div>
        </div>
      `;
    };

    const Dashboard = () => {
      const [stats, setStats] = useState(null);
      const [loading, setLoading] = useState(true);
      const [applicants, setApplicants] = useState([]);

      useEffect(() => {
        api.dashboard.getStats().then(data => { setStats(data); setLoading(false); }).catch(() => setLoading(false));
        api.applicants.getAll().then(data => setApplicants(data.applicants || [])).catch(() => {});
      }, []);

      const updateStatus = async (id, status) => {
        if (!confirm('Update status to ' + status + '?')) return;
        try {
          await api.admin.updateStatus(id, { status });
          const data = await api.applicants.getAll();
          setApplicants(data.applicants || []);
        } catch (err) {
          alert(err.message);
        }
      };

      const handleExport = () => {
        exportToCSV(applicants, 'solo_parent_applicants.csv');
      };

      return html`
        <div class="min-h-screen bg-gray-50">
          <header class="bg-white shadow-sm px-3 md:px-6 py-3 md:py-4 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-2">
            <h1 class="text-lg md:text-xl font-bold">Admin Dashboard</h1>
            <a href="/" onClick="${() => { localStorage.clear(); window.location.href = '/'; }}" class="text-red-600 hover:text-red-700 text-sm">Logout</a>
          </header>
          <main class="max-w-6xl mx-auto p-3 md:p-6">
            ${loading ? html`<div class="text-center py-12">Loading...</div>` : html`
              <div class="grid grid-cols-2 md:grid-cols-4 gap-3 md:gap-6 mb-6 md:mb-8">
                ${[['Total', stats?.overview?.total || 0, 'text-blue-600'], ['Approved', stats?.overview?.approved || 0, 'text-green-600'], ['Pending', stats?.overview?.pending || 0, 'text-yellow-600'], ['Rejected', stats?.overview?.rejected || 0, 'text-red-600']].map(([title, val, color]) => html`
                  <div class="bg-white rounded-xl shadow p-3 md:p-6">
                    <p class="text-xs md:text-sm text-gray-500">${title}</p>
                    <p class="text-2xl md:text-3xl font-bold ${color}">${val}</p>
                  </div>
                `)}
              </div>
              <div class="bg-white rounded-xl shadow p-3 md:p-6">
                <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3 mb-3 md:mb-4">
                  <h3 class="font-bold text-sm md:text-base">All Applications</h3>
                  <button onClick="${handleExport}" class="bg-green-600 text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-green-700">Export CSV</button>
                </div>
                <div class="overflow-x-auto">
                  <table class="w-full text-left text-xs md:text-sm">
                    <thead class="bg-gray-50">
                      <tr class="text-gray-500">
                        <th class="pb-2 px-1 md:px-2">Name</th>
                        <th class="pb-2 px-1 md:px-2 hidden sm:table-cell">Classification</th>
                        <th class="pb-2 px-1 md:px-2 hidden md:table-cell">Purpose</th>
                        <th class="pb-2 px-1 md:px-2">Status</th>
                        <th class="pb-2 px-1 md:px-2">Actions</th>
                      </tr>
                    </thead>
                    <tbody class="divide-y">
                      ${applicants.map(app => html`
                        <tr>
                          <td class="py-2 px-1 md:px-2">${app.last_name}, ${app.first_name}</td>
                          <td class="py-2 px-1 md:px-2 hidden sm:table-cell">${app.classification}</td>
                          <td class="py-2 px-1 md:px-2 hidden md:table-cell">${app.purpose_of_application}</td>
                          <td class="py-2 px-1 md:px-2">
                            <span class="px-1.5 md:px-2 py-0.5 md:py-1 rounded-full text-xs font-medium ${app.status === 'approved' ? 'bg-green-100 text-green-700' : app.status === 'pending' ? 'bg-yellow-100 text-yellow-700' : 'bg-red-100 text-red-700'}">${app.status}</span>
                          </td>
                          <td class="py-2 px-1 md:px-2">
                            <a href="/admin/applicants/${app.id}" class="text-blue-600 hover:text-blue-700 text-xs md:text-sm mr-1 md:mr-2">View</a>
                            <button onClick="${() => updateStatus(app.id, 'approved')}" class="text-green-600 hover:text-green-700 text-xs md:text-sm mr-1 md:mr-2">✓</button>
                            <button onClick="${() => updateStatus(app.id, 'rejected')}" class="text-red-600 hover:text-red-700 text-xs md:text-sm">✗</button>
                          </td>
                        </tr>
                      `)}
                      ${applicants.length === 0 ? html`<tr><td colspan="5" class="py-4 text-center text-gray-500">No applications yet</td></tr>` : ''}
                    </tbody>
                  </table>
                </div>
              </div>
            `}
          </main>
        </div>
      `;
    };

    const ApplicantDetails = () => {
      const [applicant, setApplicant] = useState(null);
      const [familyMembers, setFamilyMembers] = useState([]);
      const [loading, setLoading] = useState(true);
      const [error, setError] = useState('');

      const id = window.location.pathname.split('/').pop();

      useEffect(() => {
        api.applicants.getOne(id).then(data => {
          setApplicant(data);
          setFamilyMembers(data.family_members || []);
          setLoading(false);
        }).catch(e => {
          setError(e.message || 'Failed to load applicant');
          setLoading(false);
        });
      }, [id]);

      if (loading) {
        return html`<div class="min-h-screen flex items-center justify-center"><div class="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-600"></div></div>`;
      }

      if (error) {
        return html`
          <div class="min-h-screen bg-gray-50 p-6">
            <div class="max-w-4xl mx-auto bg-white rounded-xl shadow p-6">
              <div class="text-red-600 font-medium mb-4">${error}</div>
              <a href="/dashboard" class="text-blue-600 hover:text-blue-700">Back to Dashboard</a>
            </div>
          </div>
        `;
      }

      if (!applicant) {
        return html`
          <div class="min-h-screen bg-gray-50 p-6">
            <div class="max-w-4xl mx-auto bg-white rounded-xl shadow p-6">
              <div class="text-gray-600">Applicant not found.</div>
              <a href="/dashboard" class="text-blue-600 hover:text-blue-700">Back to Dashboard</a>
            </div>
          </div>
        `;
      }

      const Field = ({ label, value }) => html`
        <div>
          <div class="text-xs uppercase tracking-wide text-gray-500">${label}</div>
          <div class="mt-1 text-sm text-gray-900 break-words">${safeText(value) || '-'}</div>
        </div>
      `;

      return html`
        <div class="min-h-screen bg-gray-50 p-3 md:p-6">
          <div class="max-w-4xl mx-auto space-y-6">
            <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3">
              <div>
                <h1 class="text-xl md:text-2xl font-bold text-gray-800">Applicant Details</h1>
                <p class="text-gray-600 text-sm">${applicant.last_name}, ${applicant.first_name} ${applicant.middle_name || ''}</p>
              </div>
              <a href="/dashboard" class="text-blue-600 hover:text-blue-700 text-sm">← Back to Dashboard</a>
            </div>

            <div class="bg-white rounded-xl shadow p-4 md:p-6">
              <h2 class="text-base md:text-lg font-bold text-gray-800 mb-3 md:mb-4 border-b pb-2">Application Summary</h2>
              <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">
                <Field label="Application Type" value={applicant.application_type} />
                <Field label="ID Number" value={applicant.id_number} />
                <Field label="Expiry Date" value={applicant.expiry_date} />
                <Field label="Age" value={applicant.age} />
                <Field label="Sex" value={applicant.sex} />
                <Field label="Civil Status" value={applicant.civil_status} />
                <Field label="Classification" value={applicant.classification} />
                <Field label="Purpose" value={applicant.purpose_of_application} />
                <Field label="Status" value={applicant.status} />
              </div>
            </div>

            <div class="bg-white rounded-xl shadow p-4 md:p-6">
              <h2 class="text-base md:text-lg font-bold text-gray-800 mb-3 md:mb-4 border-b pb-2">Personal Information</h2>
              <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <Field label="Last Name" value={applicant.last_name} />
                <Field label="First Name" value={applicant.first_name} />
                <Field label="Middle Name" value={applicant.middle_name} />
                <Field label="Birthdate" value={applicant.birthdate ? new Date(applicant.birthdate).toLocaleDateString() : ''} />
                <Field label="Birth Place" value={applicant.birth_place} />
                <Field label="Address" value={applicant.address} />
                <Field label="Contact Number" value={applicant.contact_number} />
                <Field label="Facebook Account" value={applicant.facebook_account} />
                <Field label="Number of Dependents" value={applicant.number_of_dependents} />
                <Field label="Educational Attainment" value={applicant.educational_attainment} />
              </div>
            </div>

            <div class="bg-white rounded-xl shadow p-4 md:p-6">
              <h2 class="text-base md:text-lg font-bold text-gray-800 mb-3 md:mb-4 border-b pb-2">Employment</h2>
              <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <Field label="Employment Type" value={applicant.employment_type} />
                <Field label="Type of Employment" value={applicant.type_of_employment} />
                <Field label="Other Source of Income" value={applicant.other_source_of_income} />
                <Field label="Total Monthly Income" value={applicant.total_monthly_income ? 'PHP ' + applicant.total_monthly_income : ''} />
                <Field label="Type of Occupancy" value={applicant.type_of_occupancy} />
              </div>
            </div>

            <div class="bg-white rounded-xl shadow p-4 md:p-6">
              <h2 class="text-base md:text-lg font-bold text-gray-800 mb-3 md:mb-4 border-b pb-2">Memberships</h2>
              <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4">
                <div><div class="text-xs uppercase tracking-wide text-gray-500">4P's</div>${boolPill(applicant.member_4ps)}</div>
                <div><div class="text-xs uppercase tracking-wide text-gray-500">IP's</div>${boolPill(applicant.member_ip)}</div>
                <div><div class="text-xs uppercase tracking-wide text-gray-500">PhilHealth</div>${boolPill(applicant.member_philhealth)}</div>
                <div><div class="text-xs uppercase tracking-wide text-gray-500">SSS</div>${boolPill(applicant.member_sss)}</div>
                <div><div class="text-xs uppercase tracking-wide text-gray-500">GSIS</div>${boolPill(applicant.member_gsis)}</div>
                <div><div class="text-xs uppercase tracking-wide text-gray-500">PAG-IBIG</div>${boolPill(applicant.member_pagibig)}</div>
                <div class="col-span-2 sm:col-span-3 md:col-span-4"><div class="text-xs uppercase tracking-wide text-gray-500">COMELEC Registered</div>${boolPill(applicant.comelec_registered === 'Yes' || applicant.comelec_registered === true)}</div>
              </div>
            </div>

            <div class="bg-white rounded-xl shadow p-4 md:p-6">
              <h2 class="text-base md:text-lg font-bold text-gray-800 mb-3 md:mb-4 border-b pb-2">Guardian / Zone Leader</h2>
              <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <Field label="Guardian Name" value={applicant.guardian_name} />
                <Field label="Guardian Relation" value={applicant.guardian_relation} />
                <Field label="Guardian Contact" value={applicant.guardian_contact} />
                <Field label="Zone Leader Name" value={applicant.zone_leader_name} />
                <Field label="Zone Leader Contact" value={applicant.zone_leader_contact} />
              </div>
            </div>

            <div class="bg-white rounded-xl shadow p-4 md:p-6">
              <h2 class="text-base md:text-lg font-bold text-gray-800 mb-3 md:mb-4 border-b pb-2">Family Composition</h2>
              ${familyMembers.length === 0 ? html`<div class="text-gray-500 text-sm">No family members added.</div>` : html`
                <div class="overflow-x-auto">
                  <table class="w-full text-xs md:text-sm">
                    <thead class="bg-gray-50">
                      <tr class="text-left">
                        <th class="px-2 py-2">#</th>
                        <th class="px-2 py-2">Name</th>
                        <th class="px-2 py-2">Relation</th>
                        <th class="px-2 py-2">Age</th>
                        <th class="px-2 py-2">Occupation</th>
                      </tr>
                    </thead>
                    <tbody class="divide-y">
                      ${familyMembers.map((m, i) => html`
                        <tr>
                          <td class="px-2 py-2 text-gray-600">${i + 1}</td>
                          <td class="px-2 py-2">${safeText(m.name)}</td>
                          <td class="px-2 py-2">${safeText(m.relation)}</td>
                          <td class="px-2 py-2">${safeText(m.age)}</td>
                          <td class="px-2 py-2">${safeText(m.occupation)}</td>
                        </tr>
                      `)}
                    </tbody>
                  </table>
                </div>
              `}
            </div>
          </div>
        </div>
      `;
    };

    const App = () => {

    const App = () => {
      const [user, setUser] = useState(null);
      const [loading, setLoading] = useState(true);
      const path = window.location.pathname;

      useEffect(() => {
        const token = localStorage.getItem('token');
        if (token) {
          api.auth.me().then(data => { setUser(data); setLoading(false); }).catch(() => { localStorage.removeItem('token'); localStorage.removeItem('user'); setLoading(false); });
        } else {
          setLoading(false);
        }
      }, []);

      const logout = () => {
        localStorage.clear();
        window.location.href = '/';
      };

      if (loading) {
        return html`<div class="min-h-screen flex items-center justify-center"><div class="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-600"></div></div>`;
      }

      if (path === '/login') return html`<${Login} />`;
      if (path === '/register') return html`<${Register} />`;
      if (path === '/apply') return html`<${Apply} onLogout="${logout}" />`;
      if (path === '/dashboard') return html`<${Dashboard} />`;
      if (path.startsWith('/admin/applicants/')) return html`<${ApplicantDetails} />`;
      return html`<${Home} user="${user}" onLogout="${logout}" />`;
    };

    render(html`<${App} />`, document.getElementById('app'));
  </script>
</body>
</html>
