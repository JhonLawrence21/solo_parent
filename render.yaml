{
  "name": "solo-parent-system",
  "region": " oregon",
  "database": {
    "regions": ["oregon", "us-east", "eu-west"],
    "plans": {
      "starter": {
        "name": "Starter",
        "price": 5,
        "databaseSizeGb": 1,
        "connectionLimit": 5
      },
      " hobby": {
        "name": "Hobby",
        "price": 10,
        "databaseSizeGb": 10,
        "connectionLimit": 20
      }
    }
  },
  "services": [
    {
      "name": "solo-parent-api",
      "type": "web-service",
      "region": "oregon",
      "plan": "starter",
      "buildCommand": "npm install",
      "startCommand": "npm start",
      "healthCheckPath": "/api/health",
      "envVars": [
        {
          "key": "NODE_ENV",
          "value": "production"
        }
      ],
      "dependencies": [
        {
          "name": "solo-parent-db",
          "type": "postgres",
          "plan": "starter"
        }
      ]
    }
  ]
}
